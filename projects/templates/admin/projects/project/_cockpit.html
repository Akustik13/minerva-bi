{# «🧭 Пульт проєкту» (projects/cockpit.py → context); JS і стилі — change_form.html. #}
{# Без <script> і без <form>: пульт усередині форми картки, поля «📌» без name. #}
<div class="pjc" data-range="{{ range }}" data-cockpit="{{ urls.cockpit }}" data-highlight="{{ urls.highlight }}"
     data-code="{{ project.code }}" data-title="{{ project.name }}"
     data-scan="{{ urls.scan }}" data-plan-base="{{ urls.plan_base }}" data-plan-step="{{ urls.plan_step }}"
     data-plan-phase="{{ urls.plan_phase }}" data-plan-save-template="{{ urls.plan_save_template }}"
     data-has-plan="{% if plan.has_plan %}1{% endif %}" data-can-change="{% if can_change %}1{% endif %}"
     data-risk="{{ urls.risk }}" data-status-save="{{ urls.status_save }}" data-status-draft="{{ urls.status_draft }}"
     data-ai-scan="{{ urls.ai_scan }}" data-ai-plan="{{ urls.ai_plan }}" data-ai-plan-apply="{{ urls.ai_plan_apply }}"
     data-ai-base="{{ urls.ai_base }}" data-forgotten="{{ urls.forgotten }}" data-forgotten-decide="{{ urls.forgotten_decide }}"
     data-events="{{ urls.events }}" data-event-link="{{ urls.event_link }}" data-mail-handled="{{ urls.mail_handled }}"
     data-ai-settings="{{ urls.ai_settings }}" data-ai-since="{{ ai.since|date:'Y-m-d' }}" data-start="{{ start|date:'Y-m-d' }}"
     data-steps="{{ plan.steps|default:0 }}"{% if can_change %}
     data-name="{{ project.name }}"{% endif %}>
  <div class="pjc-head">
    <b class="pjc-title">🧭 Пульт проєкту</b>
    <span class="pjc-health pjc-h-{{ health.key }}"
          title="Колір — з «Потребує уваги»: є термінове — червоний, важливе — жовтий, нічого — зелений">{{ health.icon }} {{ health.label }}</span>
    {% if status.last %}<button type="button" class="pjc-st pjc-st-{{ status.last.health }}" data-pjc-tab="status"
          title="Тижневий статус: {{ status.last.text|truncatechars:300 }}">📝 {{ status.last.get_health_display }} · {{ status.last.created_at|date:"d.m" }}</button>{% endif %}
    {% if due %}
      <span class="pjc-due{% if due.late %} late{% endif %}">⏰ Строк клієнту <b>{{ due.date|date:"d.m.Y" }}</b>{% if due.text %} · {{ due.text }}{% endif %}</span>
    {% else %}<span class="pjc-sub">строк клієнту не задано</span>{% endif %}
    {% if plan.has_plan and plan.end %}<span class="pjc-fc{% if plan.late %} late{% endif %}" title="Прогноз завершення за планом">📅 прогноз <b>{{ plan.end|date:"d.m.Y" }}</b></span>{% endif %}
    {% if start %}<span class="pjc-sub">старт {{ start|date:"d.m.Y" }}</span>{% endif %}
    <span class="pjc-sub" title="Листи від клієнта / наші · Angebote · замовлення · закупівлі · JLC-замовлення · відправлення">📥 {{ counts.in }} · 📤 {{ counts.out }} · 📝 {{ counts.offers }} · 🛒 {{ counts.orders }} · 🏭 {{ more.purchases }} · 🔧 {{ more.jlc }} · 🚚 {{ more.shipments }}</span>
    <a class="pjc-link" href="{{ urls.mail }}" target="_blank">✉️ Листи проєкту</a>
    <a class="pjc-b pjc-ws-link" href="{{ urls.workspace }}" title="План, діаграми Ганта й шкала на весь екран — без полів картки">⤢ Робочий стіл</a>
    <button type="button" class="pjc-b" data-pjc-fields title="Поля проєкту: назва, клієнт, статус, строки, учасники, прив'язки">⚙️ Поля</button>
  </div>
  {% if notice %}<div class="pjc-notice" role="status">{{ notice }}</div>{% endif %}
  {% if plan.has_plan %}
    <ol class="pjc-strip" aria-label="Фази проєкту">
      {% for f in plan.strip %}
        <li class="pjc-ph pjc-ph-{{ f.status }}{% if f.gate %} pjc-ph-gate{% endif %}"{% if f.id and can_change %} data-pjc-phase="{{ f.id }}"{% endif %}
            title="{{ f.name }}{% if f.gate %} · умова переходу: {{ f.gate }}{% if f.gate_done %} ✓{% endif %}{% endif %}{% if f.dates %} · {{ f.dates }}{% endif %}">
          <b>{% if f.status == "done" %}✓ {% elif f.status == "active" %}● {% endif %}{{ f.name }}</b>
          <small>{% if f.progress %}{{ f.progress }}{% endif %}{% if f.dates %} · {{ f.dates }}{% endif %}{% if f.slip %} · <span class="pjc-slip">+{{ f.slip }} дн.</span>{% endif %}</small>
        </li>
      {% endfor %}
    </ol>
  {% endif %}

  <div class="pjc-cols">
    <section class="pjc-card" aria-label="Що зараз">
      <h4>🎯 Що зараз</h4>
      {% if next_action %}<div class="pjc-next">➡️ <b>{{ next_action }}</b></div>{% endif %}
      {% if todo %}
        <ul class="pjc-list">
          {% for a in todo %}<li class="pjc-{{ a.level }}">{{ a.icon }} {% if a.url %}<a href="{{ a.url }}" target="_blank">{{ a.text }}</a>{% else %}{{ a.text }}{% endif %}{% if a.act_json %} <button type="button" class="pjc-mk" data-pjc-act="{{ a.act_json }}" title="Позначити: відповіли телефоном, обговорили на зустрічі, зустріч відбулась, виконано…" aria-label="Позначити як зроблене">✓</button>{% endif %}</li>{% endfor %}
        </ul>
      {% elif not next_action %}<div class="pjc-sub">Нічого не чекає на нас. Запишіть «Наступну дію» в полях проєкту.</div>{% endif %}
      {% if handled %}
        <details class="pjc-hd">
          <summary>✓ Відповіли поза поштою · {{ handled|length }}</summary>
          <ul class="pjc-list">
            {% for h in handled %}<li>{% if h.dir == "in" %}📥{% else %}📤{% endif %} <a href="{{ h.url }}" target="_blank" translate="no">«{{ h.subject }}»</a>
              <span class="pjc-sub">· <span translate="no">{{ h.who }}</span> · {{ h.label }} {{ h.date|date:"d.m.Y" }}{% if h.note %} — <span translate="no">{{ h.note }}</span>{% endif %}</span>{% if can_change %}
              <button type="button" class="pjc-mk" data-pjc-unmark="{{ h.pk }}" title="Зняти позначку — лист знову в «Що зараз»" aria-label="Зняти позначку">↶</button>{% endif %}</li>{% endfor %}
          </ul>
        </details>
      {% endif %}
      {% if suggestions %}
        <div class="pjc-sg">
          <div class="pjc-sgt">🔗 Пропозиції прив'язок · {{ suggestions|length }}</div>
          <ul class="pjc-list">
            {% for s in suggestions %}
              <li>{% if s.url %}<a href="{{ s.url }}" target="_blank">{{ s.label }}</a>{% else %}{{ s.label }}{% endif %}
                <span class="pjc-sub">· {{ s.reason }}</span>
                {% if can_change and s.can_decide %}<span class="pjc-yn">
                  <button type="button" class="pjc-b" data-pjc-decide="{% url 'projects:link_decide' project.pk s.id %}" data-accept="1" title="Так, це цей проєкт">✓</button>
                  <button type="button" class="pjc-b" data-pjc-decide="{% url 'projects:link_decide' project.pk s.id %}" data-accept="0" title="Ні — більше не пропонувати">✗</button>
                </span>{% endif %}
              </li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}
      {% if can_change %}
        <div class="pjc-actions">
          <button type="button" class="pjc-b" data-pjc-scan title="Закупівлі й JLC-замовлення з товарами проєкту за останній рік">🔎 Знайти пов'язане</button>
          {% if not has_products %}<span class="pjc-sub">шукає за «Товарами проєкту» — додайте їх у полях нижче</span>{% endif %}
        </div>
      {% endif %}
    </section>

    <section class="pjc-card" aria-label="Ризики">
      <h4>⚠️ Ризики
        <button type="button" class="pjc-b pjc-right" data-pjc-tab="risks" title="Матриця й реєстр ризиків проєкту">
          реєстр{% if riskreg.counts.red %} 🔴 {{ riskreg.counts.red }}{% endif %}{% if riskreg.counts.yellow %} 🟡 {{ riskreg.counts.yellow }}{% endif %}{% if riskreg.counts.green %} 🟢 {{ riskreg.counts.green }}{% endif %}{% if not riskreg.total %} · 0{% endif %} →</button></h4>
      {% if risks %}
        <ul class="pjc-list">
          {% for a in risks %}<li class="pjc-{{ a.level }}">{{ a.icon }} {% if a.url %}<a href="{{ a.url }}" target="_blank">{{ a.text }}</a>{% else %}{{ a.text }}{% endif %}{% if a.act_json %} <button type="button" class="pjc-mk" data-pjc-act="{{ a.act_json }}" title="Позначити: відповіли телефоном, обговорили на зустрічі, зустріч відбулась, виконано…" aria-label="Позначити як зроблене">✓</button>{% endif %}</li>{% endfor %}
        </ul>
      {% else %}<div class="pjc-sub">✅ Ризиків не видно: строки, Angebote, замовлення й закупівлі в порядку.</div>{% endif %}
      {% if ai.risks %}<a class="pja-ptr" href="#pj-ai">🧠 Ризиків з листів чекають ✓/✗: {{ ai.risks }}</a>{% endif %}
    </section>

    <section class="pjc-card" aria-label="Важливі моменти">
      <h4>📌 Важливі моменти {% if moments_total %}<span class="pjc-sub">{{ moments_total }}</span>{% endif %}
        {% if can_change %}<button type="button" class="pjc-b pjc-right" data-pjc-mtoggle aria-expanded="false">＋ Додати</button>{% endif %}</h4>
      {% if can_change %}
        <div class="pjc-mform" hidden data-pjc-mform>
          <div class="pjc-mrow">
            <input type="date" data-f="date" value="{{ today|date:'Y-m-d' }}" aria-label="Дата">
            <select data-f="kind" aria-label="Вид">{% for k, l in kinds %}<option value="{{ k }}"{% if k == "other" %} selected{% endif %}>{{ l }}</option>{% endfor %}</select>
          </div>
          <input type="text" data-f="title" maxlength="255" placeholder="Що сталося: «Клієнт погодив зразок»" aria-label="Що сталося">
          {% if mails %}<select data-f="message" aria-label="Лист"><option value="">✉️ Лист (за бажанням)…</option>{% for m in mails %}<option value="{{ m.pk }}">{{ m.label }}</option>{% endfor %}</select>{% endif %}
          <textarea data-f="quote" rows="2" placeholder="Цитата з листа або примітка (за бажанням)" aria-label="Цитата або примітка"></textarea>
          <div class="pjc-mrow"><button type="button" class="pjc-b pri" data-pjc-madd>📌 Зберегти</button><span class="pjc-merr" role="alert"></span></div>
        </div>
      {% endif %}
      {% if moments %}
        <ul class="pjc-list pjc-moments">
          {% for m in moments %}
            <li class="pjc-m-{{ m.kind_key }}"><time>{{ m.date|date:"d.m.Y" }}</time> {{ m.icon }}
              {% if m.url %}<a href="{{ m.url }}" target="_blank">{{ m.title }}</a>{% else %}{{ m.title }}{% endif %}
              <span class="pjc-sub">· {{ m.kind }}</span>
              {% if can_change %}<button type="button" class="pjc-x" data-pjc-mdel="{% url 'projects:highlight_delete' m.id %}" title="Прибрати момент" aria-label="Прибрати момент">✕</button>{% endif %}
              {% if m.quote %}<div class="pjc-q">«{{ m.quote|truncatechars:180 }}»</div>{% endif %}
            </li>
          {% endfor %}
        </ul>
        {% if moments_total > moments|length %}<div class="pjc-sub">Усі моменти — у розділі «📌 Важливі моменти» нижче.</div>{% endif %}
      {% else %}
        <div class="pjc-sub">Позначайте рішення, погодження, зміни вимог і проблеми — вони стануть прапорцями на шкалі.
          З пошти — 📌 біля проєкту в прев'ю листа, зі шкали — клік на точку листа.</div>
      {% endif %}
      {% if ai.moments %}<a class="pja-ptr" href="#pj-ai">🧠 Моментів з листів чекають ✓/✗: {{ ai.moments }}</a>{% endif %}
    </section>
  </div>

  {% if ai.on %}
  <section class="pjc-card pja" id="pj-ai" aria-label="AI-помічник проєкту">
    <h4>🧠 AI-помічник <span class="pjc-sub">читає лише ваші листи · лише пропонує, вирішуєте ви</span></h4>
    <div class="pjc-actions">
      <button type="button" class="pjc-b" data-pja-scan{% if not ai.unread %} disabled{% endif %}
              title="Claude Haiku читає ваші листи проєкту, яких ще не читав (до 12 за раз), і пропонує важливі моменти й ризики — з цитатою з листа">🧠 Знайти моменти й ризики{% if ai.unread %} · непрочитаних листів {{ ai.unread }}{% elif ai.own %} · усі листи прочитано{% endif %}</button>
      <button type="button" class="pjc-b" data-pja-forgotten
              title="Гілки з ваших скриньок, які стосуються проєкту, але не прив'язані: учасники, клієнт, номери замовлень і закупівель, артикули{% if ai.rag %} і база знань{% endif %}">🔎 Знайти забуті листи</button>
      <button type="button" class="pjc-b" data-pja-plan
              title="Claude Sonnet складає чернетку плану з ваших листів, шаблонів, тривалостей минулих проєктів і вашої підказки (що врахувати, що вже відбулось); перед застосуванням ви її переглядаєте">🧠 {% if plan.has_plan %}Переробити план з листування{% else %}Скласти план з листування{% endif %}</button>
      <span class="pjc-merr" data-pja-err role="alert"></span>
    </div>
    <div class="pja-set">
      <label>📅 Листи для AI — з <input type="date" data-pja-since value="{{ ai.since|date:'Y-m-d' }}"></label>
      <label>старт проєкту <input type="date" data-pja-start value="{{ start|date:'Y-m-d' }}"></label>
      <button type="button" class="pjc-b" data-pja-settings>💾 Зберегти</button>
      <span class="pjc-sub">«Знайти моменти й ризики», «Забуті листи» й план з листування читають листи лише з цієї дати; порожньо — усі листи.</span>
    </div>
    {% if not ai.own %}<p class="pjc-sub">У проєкті ще немає листів з ваших скриньок — моменти й ризики AI шукає лише у вашій пошті.</p>{% endif %}
    {% if ai.items %}
      <ul class="pjc-list pja-list">
        {% for s in ai.items %}
          <li class="pja-it pja-{{ s.kind }}">
            <span class="pja-k">{% if s.risk %}<span class="pjr-score pjr-{{ s.level }}" title="ймовірність × вплив">{{ s.score }}</span> ⚠️ ризик · {% else %}📌 момент · {% endif %}{{ s.icon }} {{ s.label }}</span>
            <b translate="no">{{ s.title }}</b>
            <span class="pjc-sub">{{ s.date|date:"d.m.Y" }}{% if s.url %} · <a href="{{ s.url }}" target="_blank">✉️ лист</a>{% endif %}</span>
            <span class="pjc-yn">
              <button type="button" class="pjc-b" data-pja-decide="{{ s.id }}" data-accept="1" title="{% if s.risk %}Так — додати ризик до проєкту{% else %}Так — додати важливий момент{% endif %}">✓</button>
              <button type="button" class="pjc-b" data-pja-decide="{{ s.id }}" data-accept="0" title="Ні — більше не пропонувати">✗</button>
            </span>
            <div class="pjc-q" translate="no">«{{ s.quote|truncatechars:260 }}»</div>
            {% if s.mitigation %}<div class="pjc-sub">заходи: <span translate="no">{{ s.mitigation }}</span></div>{% endif %}
          </li>
        {% endfor %}
      </ul>
    {% endif %}
    <div class="pja-found" data-pja-found hidden></div>
  </section>
  {% endif %}

  <section class="pjc-card pjc-tl" id="pj-plan" aria-label="Шкала й план проєкту">
    <div class="pjc-tabs" role="tablist">
      <button type="button" class="pjc-tab" role="tab" data-pjc-tab="timeline">🗓 Шкала проєкту</button>
      <button type="button" class="pjc-tab" role="tab" data-pjc-tab="plan">📅 План{% if plan.has_plan %} · {{ plan.steps }} кроків{% endif %}</button>
      <button type="button" class="pjc-tab" role="tab" data-pjc-tab="risks">⚠️ Ризики{% if riskreg.total %} · {{ riskreg.total }}{% endif %}</button>
      <button type="button" class="pjc-tab" role="tab" data-pjc-tab="status">📝 Статус{% if status.last %} {{ status.last_dot }}{% endif %}</button>
    </div>

    <div class="pjc-pane" data-pjc-pane="risks" id="pj-risks">
      <div class="pjc-ptools">
        {% if can_change %}<button type="button" class="pjc-b pri" data-pjc-risk-new>＋ Ризик</button>{% endif %}
        <span class="pjc-sub">бал = ймовірність × вплив: до 2 — 🟢, 3–4 — 🟡, від 6 — 🔴 · ⚙️ правила відкривають і закривають ризики самі</span>
        <a class="pjc-b pjc-right" href="/admin/projects/projectrisk/?project__id__exact={{ project.pk }}">⚠️ Реєстр усіх ризиків →</a>
      </div>
      <div class="pjr">
        <div class="pjr-matrix" aria-label="Матриця ризиків: ймовірність × вплив">
          <div class="pjr-cap">ймовірність ↑</div>
          {% for row in riskreg.matrix %}
            <div class="pjr-row"><span class="pjr-axis">{{ row.p }}</span>
              {% for cell in row.cells %}
                <div class="pjr-cell pjr-{{ cell.level }}" title="ймовірність {{ row.p }} × вплив {{ cell.i }} = {{ cell.score }}">
                  {% for it in cell.items %}<button type="button" class="pjr-n" data-pjc-risk="{{ it.risk.pk }}" title="{{ it.risk.title }}">{{ it.n }}</button>{% endfor %}
                </div>
              {% endfor %}
            </div>
          {% endfor %}
          <div class="pjr-row pjr-xaxis"><span class="pjr-axis"></span><span>1</span><span>2</span><span>3</span></div>
          <div class="pjr-cap pjr-xcap">вплив на строк і гроші →</div>
        </div>
        <div class="pjr-list">
          <table class="pjr-t">
            <thead><tr><th>№</th><th>Ризик</th><th>Звідки</th><th>Бал</th><th>Заходи</th><th>Власник</th><th>Переглянути</th><th>Стан</th></tr></thead>
            <tbody>
            {% for row in riskreg.rows %}
              {% with r=row.risk %}
              <tr{% if can_change %} data-pjc-risk="{{ r.pk }}" tabindex="0"{% endif %} title="{{ r.evidence|default:r.description }}">
                <td>{{ row.n }}</td>
                <td><b translate="no">{{ r.title }}</b>{% if row.steps %}<div class="pjc-sub">кроки: <span translate="no">{{ row.steps|join:", " }}</span></div>{% endif %}</td>
                <td class="pjc-sub">{{ r.get_source_display }}{% if row.rule %} «{{ row.rule }}»{% endif %}</td>
                <td><span class="pjr-score pjr-{{ r.level }}">{{ r.score }}</span></td>
                <td>{% if r.mitigation %}<span translate="no">{{ r.mitigation|truncatechars:90 }}</span>{% else %}<span class="pjc-sub">—</span>{% endif %}</td>
                <td>{% if r.owner %}<span translate="no">{{ r.owner.get_full_name|default:r.owner.username }}</span>{% else %}<span class="pjc-sub">—</span>{% endif %}</td>
                <td>{% if r.review_on %}<span class="{% if r.review_on < today %}pjc-high{% endif %}">{{ r.review_on|date:"d.m" }}</span>{% else %}<span class="pjc-sub">—</span>{% endif %}</td>
                <td>{{ r.get_status_display }}</td>
              </tr>
              {% endwith %}
            {% empty %}
              <tr><td colspan="8" class="pjc-sub">✅ Відкритих ризиків немає. Правила відкриють їх самі, коли щось почне загрожувати строку{% if can_change %}, або додайте свій — «＋ Ризик»{% endif %}.</td></tr>
            {% endfor %}
            </tbody>
          </table>
          {% if riskreg.closed %}
            <details class="pjr-closed"><summary>Закриті · {{ riskreg.closed_total }}</summary>
              <ul class="pjc-list">{% for r in riskreg.closed %}<li{% if can_change %} data-pjc-risk="{{ r.pk }}" class="pjr-link"{% endif %}>✓ <span translate="no">{{ r.title }}</span> <span class="pjc-sub">· {{ r.get_source_display }}{% if r.closed_at %} · {{ r.closed_at|date:"d.m.Y" }}{% endif %}{% if r.closed_auto %} · умова зникла{% endif %}</span></li>{% endfor %}</ul>
            </details>
          {% endif %}
        </div>
      </div>
      {% if riskreg.data %}{{ riskreg.data|json_script:"pjr-data" }}{% endif %}
    </div>

    <div class="pjc-pane" data-pjc-pane="status" id="pj-status">
      <div class="pjs">
        <section class="pjs-last">
          {% if status.last %}
            <div class="pjs-head"><b class="pjs-h pjs-{{ status.last.health }}">{{ status.last.get_health_display }}</b>
              <span class="pjc-sub">{{ status.last.created_at|date:"d.m.Y" }}{% if status.last.author %} · <span translate="no">{{ status.last.author.get_full_name|default:status.last.author.username }}</span>{% endif %} · {% if status.age %}{{ status.age }} дн. тому{% else %}сьогодні{% endif %}{% if status.last.ai_draft %} · з AI-чернетки{% endif %}</span></div>
            <div class="pjs-text" translate="no">{{ status.last.text|linebreaksbr }}</div>
          {% else %}
            <p class="pjc-sub">Тижневого статусу ще немає. Раз на тиждень коротко запишіть, як справи: колір і кілька речень — так видно, як змінювався проєкт.</p>
          {% endif %}
          {% if status.history %}
            <div class="pjs-hist"><span class="pjc-sub">Історія:</span>
              {% for u in status.history %}<span class="pjs-dot pjs-{{ u.health }}{% if u.source == 'auto' %} pjs-auto{% endif %}" title="{{ u.created_at|date:'d.m.Y' }} · {{ u.get_health_display }}{% if u.source == 'auto' %} · знімок тижневого звіту{% endif %} · {{ u.text|truncatechars:200 }}"></span>{% endfor %}
            </div>
          {% endif %}
        </section>
        {% if can_change and project.is_open %}
          <section class="pjs-form" aria-label="Новий тижневий статус">
            <div class="pjc-mrow" role="group" aria-label="Колір статусу">
              {% for key, label in status.choices %}<button type="button" class="pjc-b pjs-c pjs-{{ key }}{% if key == status.suggest %} on{% endif %}" data-pjs-health="{{ key }}" aria-pressed="{% if key == status.suggest %}true{% else %}false{% endif %}">{{ label }}</button>{% endfor %}
            </div>
            <textarea data-pjs-text rows="5" aria-label="Тижневий статус">{{ status.draft }}</textarea>
            <div class="pjc-mrow">
              <button type="button" class="pjc-b pri" data-pjs-save>💾 Зберегти статус</button>
              <button type="button" class="pjc-b" data-pjs-ai title="Claude Haiku: чернетка з фактів тижня; нічого не зберігає">🧠 AI-чернетка</button>
              <span class="pjc-merr" data-pjs-err role="alert"></span>
            </div>
            <p class="pjc-sub">Колір запропоновано з «потребує уваги», текст — з даних тижня (кроки, моменти, ризики). Змініть, як вважаєте правильним.</p>
          </section>
        {% endif %}
      </div>
    </div>

    <div class="pjc-pane" data-pjc-pane="plan">
      {% if plan.has_plan %}
        <div class="pjc-ptools">
          {% if can_change %}
            <button type="button" class="pjc-b pri" data-pjc-step-new>＋ Крок</button>
            <button type="button" class="pjc-b" data-pjc-phase-new>＋ Фаза</button>
            <button type="button" class="pjc-b" data-pjc-post="{{ urls.plan_baseline }}"
                    data-confirm="{% if plan.baseline_at %}Перезаписати базовий план поточним прогнозом?{% else %}Зафіксувати поточний план як базовий — з ним порівнюватиметься зсув?{% endif %}">📌 {% if plan.baseline_at %}Перезаписати{% else %}Зафіксувати{% endif %} базовий план</button>
            <button type="button" class="pjc-b" data-pjc-save-tpl>💾 Зберегти як шаблон</button>
          {% endif %}
          <span class="pjc-sub">{% if plan.baseline_at %}базовий план від {{ plan.baseline_at|date:"d.m.Y" }}{% else %}базовий план не зафіксовано{% endif %}{% if plan.critical %} · на критичному шляху {{ plan.critical }}{% endif %}</span>
          {% if can_change %}<button type="button" class="pjc-b pjc-right pjc-danger" data-pjc-post="{{ urls.plan_clear }}"
                  data-confirm="Видалити весь план (фази й кроки)? Листи, замовлення й закупівлі проєкту лишаться.">🗑 Очистити план</button>{% endif %}
        </div>
        <div class="pjc-ptools pjg-views">
          <span class="pjc-ranges" role="group" aria-label="Вигляд діаграми Ганта">
            <button type="button" class="pjc-b" data-pjg-view="ours" aria-pressed="true">📊 Діаграма Minerva</button>
            <button type="button" class="pjc-b" data-pjg-view="classic" aria-pressed="false">📋 Класична діаграма Ганта</button>
          </span>
          <span class="pjc-ranges" role="group" aria-label="Деталізація діаграми">
            <button type="button" class="pjc-b" data-pjg-detail-btn="brief" title="Лише фази й віхи (◆) — ключові моменти проєкту">Коротко</button>
            <button type="button" class="pjc-b" data-pjg-detail-btn="full" title="Усі кроки кожної фази">Детально</button>
          </span>
          <span class="pjc-ranges" role="group" aria-label="Масштаб" data-pjg-only="classic" hidden>
            <button type="button" class="pjc-b" data-pjg-zoom="out" title="Віддалити (Ctrl + коліщатко)">－</button>
            <button type="button" class="pjc-b" data-pjg-scale="day">Дні</button>
            <button type="button" class="pjc-b" data-pjg-scale="week">Тижні</button>
            <button type="button" class="pjc-b" data-pjg-scale="month">Місяці</button>
            <button type="button" class="pjc-b" data-pjg-zoom="in" title="Наблизити (Ctrl + коліщатко)">＋</button>
          </span>
          <span class="pjc-hint" data-pjg-only="classic" hidden>{% if can_change %}Ctrl + коліщатко — масштаб · тягніть фон — прокрутка · тягніть смугу — нові дати, край — тривалість · правий клік — меню · клік на фазу — згорнути{% else %}Ctrl + коліщатко — масштаб · тягніть фон — прокрутка · клік на фазу — згорнути{% endif %}</span>
          {% if can_change %}<span class="pjc-hint" data-pjg-only="ours">Тягніть смугу чи ◆ — нові дати, край смуги — тривалість · клік — вікно кроку · правий клік — меню</span>{% endif %}
        </div>
        <div class="pjc-svg" data-pjg-pane="ours"><div data-pjg-detail="full">{{ plan.gantt|safe }}</div><div data-pjg-detail="brief" hidden>{{ plan.gantt_brief|safe }}</div></div>
        <div class="pjg2" data-pjg-pane="classic" hidden></div>
        {{ plan.classic|json_script:"pjg-data" }}
        <div class="pjc-legend">
          <span><i class="lg-bar ok"></i>виконано</span><span><i class="lg-bar open"></i>в роботі</span>
          <span><i class="lg-bar warn"></i>чекаємо</span><span><i class="lg-bar plan"></i>заплановано</span>
          <span><i class="lg-bar crit"></i>критичний шлях</span><span><i class="lg-base"></i>базовий план</span>
          <span>◆ віха · +N — зсув від базового · 🔗 стан з прив'язаних об'єктів</span>
          <span class="pjc-hint">{% if can_change %}Клік на крок чи фазу — змінити.{% endif %}</span>
        </div>
        {% if plan.data %}{{ plan.data|json_script:"pjp-data" }}{% endif %}
      {% else %}
        <div class="pjc-empty">
          <p>Плану ще немає.{% if can_change %} Складіть його з шаблону — фази, кроки й дати з'являться самі, далі їх можна змінити.{% endif %}</p>
          <p class="pjc-sub" data-pjc-gantt-hint>📊 Коли план буде, тут з'явиться діаграма Ганта — перемикач над нею: «Діаграма Minerva» або «Класична діаграма Ганта».</p>
          {% if can_change %}
            <div class="pjc-mrow">
              <select data-pjc-tpl aria-label="Шаблон плану">
                {% for t in plan.templates %}<option value="{{ t.id }}" title="{{ t.description }}">{{ t.name }} · фаз {{ t.counts.0 }}, кроків {{ t.counts.1 }}</option>{% endfor %}
              </select>
              <label class="pjc-sub">старт <input type="date" data-pjc-tpl-start value="{% if start %}{{ start|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}"></label>
              <button type="button" class="pjc-b pri" data-pjc-tpl-apply data-url="{{ urls.plan_template }}">🧩 Скласти план з шаблону</button>
              <button type="button" class="pjc-b" data-pjc-phase-new>＋ Фаза вручну</button>
              {% if ai.on %}<button type="button" class="pjc-b" data-pja-plan
                      title="Claude Sonnet складає чернетку плану з ваших листів, шаблонів і тривалостей минулих проєктів; перед застосуванням ви її переглядаєте">🧠 Скласти план з листування</button>{% endif %}
            </div>
          {% endif %}
        </div>
      {% endif %}
    </div>

    <div class="pjc-pane" data-pjc-pane="timeline">
    {% if can_change %}<h4 class="pjt-head"><button type="button" class="pjc-b pjc-right" data-pjc-event-add title="Зустріч чи термін з вашого календаря, який не прийшов листом проєкту">📅 ＋ Подія з календаря</button></h4>{% endif %}
    {# SVG з сервера — поки браузер не намалював живу шкалу (pj_timeline.js: масштаб, прокрутка, доріжки) #}
    <div class="pjc-svg" data-pjt-live>{{ timeline|safe }}</div>
    {{ timeline_data|json_script:"pjt-data" }}
    {% if timeline_list %}
      <ul class="pjt-mlist" aria-label="Події проєкту">
        {% for e in timeline_list %}<li class="pjt-ml-{{ e.cls|default:'def' }}"><time>{{ e.date|date:"d.m.y" }}</time> <span translate="no">{% if e.url %}<a href="{{ e.url }}" target="_blank" rel="noopener">{{ e.icon }} {{ e.text }}</a>{% else %}{{ e.icon }} {{ e.text }}{% endif %}</span></li>{% endfor %}
      </ul>
    {% endif %}
    <div class="pjc-legend">
      <span><i class="lg-dot in"></i>лист клієнта</span><span><i class="lg-dot out"></i>наш лист</span>
      <span><i class="lg-ring"></i>чекає нашої відповіді</span>
      <span><i class="lg-bar ok"></i>завершено</span><span><i class="lg-bar open"></i>в роботі</span>
      <span><i class="lg-bar bad"></i>прострочено</span><span><i class="lg-bar warn"></i>затримка</span>
      <span><i class="lg-bar plan"></i>чернетка</span>
      <span class="pjc-hint">Наведіть на позначку — подробиці, клік — відкрити; клік на точку листа — меню з 📌.</span>
    </div>
    </div>
  </section>
</div>
