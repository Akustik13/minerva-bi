{% extends "admin/change_form.html" %}
{% block extrahead %}
{{ block.super }}
<style>
/* Курси і шаблон ступенів — таблиці замість JSON (textarea лишається носієм даних) */
.field-fx_rates textarea, .field-price_breaks textarea { display: none !important; }
.ss-table { border-collapse: collapse; font-size: 13px; min-width: 420px; margin-bottom: 6px; }
.ss-table th { text-align: left; padding: 6px 10px; background: var(--bg-hover, #1e2d40); color: var(--text-muted, #9aafbe);
  font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 2px solid var(--border-strong, #243347); }
.ss-table td { padding: 4px 6px; border-bottom: 1px solid var(--border-strong, #243347); vertical-align: middle; }
.ss-table input { width: 110px; background: var(--bg-input, #141f2b); color: var(--text, #c9d8e4);
  border: 1px solid var(--border-strong, #243347); border-radius: 3px; padding: 5px 8px; font-size: 13px; text-align: right; box-sizing: border-box; }
.ss-table input.ss-cur { width: 70px; text-align: center; text-transform: uppercase; }
.ss-table input:focus { outline: none; border-color: var(--accent, #58a6ff); box-shadow: 0 0 0 2px rgba(88,166,255,.2); }
.ss-table input.is-bad { border-color: var(--err, #e53935); }
.ss-hint { color: var(--text-muted, #9aafbe); font-size: 12px; white-space: nowrap; }
.ss-btn { background: var(--bg-hover, #1e2d40); color: var(--text, #c9d8e4); border: 1px solid var(--border-strong, #243347);
  border-radius: 4px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
.ss-btn:hover { border-color: var(--accent, #58a6ff); }
.ss-del { background: none; border: none; color: var(--text-dim, #607d8b); cursor: pointer; font-size: 18px; padding: 0 6px; }
.ss-del:hover { color: var(--err, #e53935); }
.ss-ecb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 2px 0 4px; }
.ss-ecb .ss-hint { white-space: normal; }
.ss-hot { color: var(--warn, #e3b341); }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var HOME = '{{ home_currency|default:"EUR"|escapejs }}';
  var ECB_URL = '{% url "core_fx_online" %}', ECB = null;   // довідкові курси ЄЦБ (core/fx_online.py)
  function ecbRate(cur) {                                   // 1 cur = ? HOME за ЄЦБ (крос через EUR)
    if (!ECB) return null;
    var a = num(ECB.rates[cur]), b = num(ECB.rates[HOME]);
    return a > 0 && b > 0 ? b / a : null;
  }
  function num(v) { v = String(v == null ? '' : v).trim().replace(',', '.'); return v === '' ? NaN : Number(v); }
  function fmt(n) { return (Math.round(n * 10000) / 10000).toString().replace('.', ','); }
  function parse(ta, empty) { try { var v = JSON.parse(ta.value || ''); return v == null ? empty : v; } catch (e) { return empty; } }

  /* Таблиця: cols = [{key, label, cls, placeholder}], toRows(json) → [[…]], toJson(rows) → json, hint(row) → текст */
  function tableEditor(ta, cols, toRows, toJson, hint, addLabel, validate) {
    if (!ta) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = '<table class="ss-table"><thead><tr>' +
      cols.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') +
      '<th></th><th style="width:36px"></th></tr></thead><tbody></tbody></table>' +
      '<button type="button" class="ss-btn">' + addLabel + '</button>';
    ta.parentNode.insertBefore(wrap, ta);
    var body = wrap.querySelector('tbody');
    function sync() {
      var rows = [];
      body.querySelectorAll('tr').forEach(function (tr) {
        var vals = Array.prototype.map.call(tr.querySelectorAll('input'), function (i) { return i.value.trim(); });
        tr.querySelectorAll('input').forEach(function (inp, k) { inp.classList.toggle('is-bad', !validate(k, vals[k], vals)); });
        tr.querySelector('.ss-hint').textContent = hint(vals);
        if (vals.some(function (v) { return v !== ''; })) rows.push(vals);
      });
      ta.value = JSON.stringify(toJson(rows));
    }
    function add(vals) {
      var tr = document.createElement('tr');
      tr.innerHTML = cols.map(function (c) {
        return '<td><input type="text" class="' + (c.cls || '') + '" placeholder="' + (c.placeholder || '') + '"></td>';
      }).join('') + '<td class="ss-hint"></td><td><button type="button" class="ss-del" title="Видалити">×</button></td>';
      tr.querySelectorAll('input').forEach(function (inp, k) { inp.value = vals[k] == null ? '' : vals[k]; inp.addEventListener('input', sync); });
      tr.querySelector('.ss-del').addEventListener('click', function () { tr.remove(); sync(); });
      body.appendChild(tr);
      return tr;
    }
    toRows(parse(ta, null)).forEach(add);
    if (!body.children.length) add([]);
    wrap.querySelector('.ss-btn').addEventListener('click', function () { add([]).querySelector('input').focus(); sync(); });
    sync();
    return { wrap: wrap, body: body, add: add, sync: sync };
  }

  // ── Курси валют: валюта | 1 валюта = ? HOME | порівняння з ЄЦБ ──
  var fx = tableEditor(document.querySelector('textarea[name="fx_rates"]'),
    [{ label: 'Валюта', cls: 'ss-cur', placeholder: 'USD' }, { label: '1 одиниця = ? ' + HOME, placeholder: '0,86' }],
    function (j) { return Object.keys(j || {}).map(function (k) { return [k, String(j[k]).replace('.', ',')]; }); },
    function (rows) { var o = {}; rows.forEach(function (r) { var c = r[0].toUpperCase(), v = num(r[1]); if (c && v > 0) o[c] = v; }); return o; },
    function (r) { var c = (r[0] || '').toUpperCase(), v = num(r[1]);
      if (!(c && v > 0)) return '';
      var t = '1 ' + c + ' = ' + fmt(v) + ' ' + HOME + ' · 1 ' + HOME + ' = ' + fmt(1 / v) + ' ' + c, e = ecbRate(c);
      if (e) {
        var p = Math.round((v / e - 1) * 1000) / 10;
        t += ' · 🌐 ЄЦБ: ' + fmt(e) + (Math.abs(p) >= 0.1 ? ' (' + (p > 0 ? '+' : '') + String(p).replace('.', ',').replace('-', '−') + ' %)' : ' ✓');
      }
      return t; },
    '+ Додати валюту',
    function (k, v) { return v === '' || (k === 0 ? /^[A-Za-z]{3}$/.test(v) : num(v) > 0); });
  if (fx) {
    var box = document.createElement('div');
    box.className = 'ss-ecb';
    box.innerHTML = '<button type="button" class="ss-btn ss-ecb-btn" title="Довідкові курси Європейського центрального банку — ' +
      'підставляються в таблицю, зберігаються кнопкою «Зберегти»">🌐 Підставити курси ЄЦБ</button><span class="ss-hint ss-ecb-st">Завантаження курсів ЄЦБ…</span>';
    fx.wrap.appendChild(box);
    var st = box.querySelector('.ss-ecb-st'), btn = box.querySelector('.ss-ecb-btn');
    fetch(ECB_URL, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) { st.textContent = '🌐 ' + ((j && j.error) || 'Курси ЄЦБ недоступні.'); btn.disabled = true; return; }
        ECB = j;
        st.textContent = 'ЄЦБ на ' + j.date_text + ' — порівняння в кожному рядку.';
        fx.sync();
      })
      .catch(function () { st.textContent = '🌐 Курси ЄЦБ недоступні (мережа).'; btn.disabled = true; });
    btn.addEventListener('click', function () {
      if (!ECB) return;
      var done = [], missing = [], rows = fx.body.querySelectorAll('tr');
      if (!Array.prototype.some.call(rows, function (tr) { return tr.querySelector('input').value.trim(); })) {
        var first = rows[0] || fx.add([]);
        first.querySelector('input').value = 'USD';
        rows = fx.body.querySelectorAll('tr');
      }
      Array.prototype.forEach.call(rows, function (tr) {
        var inp = tr.querySelectorAll('input'), c = inp[0].value.trim().toUpperCase();
        if (!c) return;
        var e = ecbRate(c);
        if (e) { inp[1].value = fmt(Math.round(e * 1e6) / 1e6); done.push(c); } else missing.push(c);
      });
      fx.sync();
      st.innerHTML = '';
      st.textContent = (done.length ? '✓ Курси ЄЦБ на ' + ECB.date_text + ' підставлено (' + done.join(', ') + ') — натисніть «Зберегти». ' : '') +
        (missing.length ? 'У ЄЦБ немає: ' + missing.join(', ') + '.' : '');
      st.classList.toggle('ss-hot', !!done.length);
    });
  }

  // ── Шаблон ступенів: від кількості | знижка % ──
  tableEditor(document.querySelector('textarea[name="price_breaks"]'),
    [{ label: 'Від кількості, шт.', placeholder: '10' }, { label: 'Знижка, %', placeholder: '5' }],
    function (j) { return (j || []).slice().sort(function (a, b) { return a.min_qty - b.min_qty; })
      .map(function (r) { return [String(r.min_qty), String(r.discount).replace('.', ',')]; }); },
    function (rows) { return rows.map(function (r) { return { min_qty: num(r[0]), discount: num(r[1]) }; })
      .filter(function (r) { return r.min_qty >= 2 && r.discount >= 0 && r.discount < 100; })
      .sort(function (a, b) { return a.min_qty - b.min_qty; }); },
    function (r) { var d = num(r[1]); return d >= 0 && d < 100 ? 'ціна 100,00 → ' + fmt(100 - d) : ''; },
    '+ Додати ступінь',
    function (k, v) { var n = num(v); return v === '' || (k === 0 ? n >= 2 && Math.floor(n) === n : n >= 0 && n < 100); });
});
</script>
{% endblock %}
