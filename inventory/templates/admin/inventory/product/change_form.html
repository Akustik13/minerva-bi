{% extends "admin/change_form.html" %}
{% load i18n %}

{% block extrahead %}
{{ block.super }}
<style>
/* Hide raw tech_attributes textarea, keep container visible */
.field-tech_attributes > .flex-container,
.field-tech_attributes textarea { display: none !important; }
.field-tech_attributes { display: block !important; }

/* BOM inline — переміщення одразу після bom_type + show/hide */
#productcomponent_set-group {
  margin-top: 24px; border-top: 2px solid var(--border-strong, #243347); padding-top: 12px;
  order: 4; /* позиціонування після bom_type */
}
#productcomponent_set-group.bom-hidden {
  display: none !important;
}
#productcomponent_set-group h2 {
  font-size: 14px; color: var(--text, #c9d8e4); margin-bottom: 8px; margin-top: 0;
}
/* Переміщення inline у форму одразу після bom_type */
.form-row:has(#id_bom_type) {
  position: relative;
}
.form-row:has(#id_bom_type)::after {
  content: '';
  display: block;
  height: 0;
  overflow: hidden;
}

/* Attrs table */
.inv-attrs-wrap { margin: 4px 0 8px; width: 100%; }
.inv-attrs-table {
  border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed;
}
.inv-attrs-table th {
  text-align: left; padding: 6px 14px;
  background: var(--bg-hover, #1e2d40); color: var(--text-muted, #9aafbe);
  font-weight: 600; font-size: 11px; text-transform: uppercase;
  letter-spacing: .5px; border-bottom: 2px solid var(--border-strong, #243347);
}
.inv-attrs-table th:first-child { width: 270px; }
.inv-attrs-table td { padding: 4px 8px; border-bottom: 1px solid var(--border-strong, #243347); vertical-align: middle; word-break: break-word; }
.inv-attr-key input, .inv-attr-val input {
  width: 100%; background: var(--bg-input, #141f2b); color: var(--text, #c9d8e4);
  border: 1px solid var(--border-strong, #243347); border-radius: 3px;
  padding: 5px 10px; font-size: 13px; box-sizing: border-box;
}
.inv-attr-key input:focus, .inv-attr-val input:focus {
  outline: none; border-color: var(--accent, #58a6ff);
  box-shadow: 0 0 0 2px rgba(88,166,255,.2);
}
.inv-del-row {
  background: none; border: none; color: var(--text-dim, #607d8b);
  cursor: pointer; font-size: 18px; padding: 0 6px; transition: color .1s;
}
.inv-del-row:hover { color: var(--err, #e53935); }
.inv-attrs-footer { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.inv-add-btn {
  background: var(--bg-hover, #1e2d40); color: var(--text, #c9d8e4);
  border: 1px solid var(--border-strong, #243347); border-radius: 4px;
  padding: 5px 14px; font-size: 12px; cursor: pointer; transition: background .15s;
}
.inv-add-btn:hover { background: var(--bg-card, #1a2535); }
.inv-attrs-empty { color: var(--text-muted, #9aafbe); font-size: 12px; font-style: italic; padding: 8px 10px; }
.inv-sync-btn {
  padding: 5px 14px; font-size: 12px; cursor: pointer; border-radius: 4px;
  background: rgba(0,105,92,.2); color: #00bfa5;
  border: 1px solid rgba(0,105,92,.4); transition: background .15s;
}
.inv-sync-btn:hover { background: rgba(0,105,92,.35); }
.inv-sync-status { font-size: 12px; color: var(--text-muted, #9aafbe); margin-left: 6px; }
</style>

<script>
var _invATbody = null, _invATa = null;

function invAttrsInit() {
  _invATa = document.querySelector('[name="tech_attributes"]');
  if (!_invATa) return;

  var wrap = document.createElement('div');
  wrap.className = 'inv-attrs-wrap';
  wrap.innerHTML =
    '<table class="inv-attrs-table"><thead><tr>' +
      '<th>Параметр</th><th>Значення</th><th style="width:36px"></th>' +
    '</tr></thead><tbody class="inv-atbody"></tbody></table>' +
    '<div class="inv-attrs-empty" id="invAttrsEmpty" style="display:none">' +
      'Порожньо — додайте параметри або синхронізуйте з DigiKey лістингом.' +
    '</div>' +
    '<div class="inv-attrs-footer">' +
      '<button type="button" class="inv-add-btn" id="invAddAttr">+ Додати параметр</button>' +
      '<button type="button" class="inv-sync-btn" id="invSyncBtn" style="display:none">🔄 Синх з DigiKey</button>' +
      '<span class="inv-sync-status" id="invSyncStatus"></span>' +
    '</div>';

  _invATa.parentNode.insertBefore(wrap, _invATa);
  _invATbody = wrap.querySelector('.inv-atbody');

  wrap.querySelector('#invAddAttr').addEventListener('click', function() {
    _invAddRow('', '');
    var newRow = _invATbody.lastElementChild;
    if (newRow) newRow.querySelector('.inv-key-inp').focus();
    _invSync();
  });

  var ex = {};
  try { var r = _invATa.value.trim(); if (r && r !== '{}') ex = JSON.parse(r); } catch(e) {}
  if (Object.keys(ex).length) {
    Object.keys(ex).sort().forEach(function(k) { _invAddRow(k, ex[k]); });
  }
  _invSync();
  _invUpdateEmpty();
}

function _invAddRow(key, val) {
  var tr = document.createElement('tr');
  tr.innerHTML =
    '<td class="inv-attr-key"><input type="text" class="inv-key-inp" value="' + _invEsc(key) + '" placeholder="Назва параметру" autocomplete="off"></td>' +
    '<td class="inv-attr-val"><input type="text" class="inv-val-inp" value="' + _invEsc(String(val===null||val===undefined?'':val)) + '" placeholder="Значення" autocomplete="off"></td>' +
    '<td><button type="button" class="inv-del-row">×</button></td>';
  tr.querySelector('.inv-del-row').addEventListener('click', function() {
    tr.remove(); _invSync(); _invUpdateEmpty();
  });
  tr.querySelector('.inv-key-inp').addEventListener('input', _invSync);
  tr.querySelector('.inv-val-inp').addEventListener('input', _invSync);
  _invATbody.appendChild(tr);
  _invUpdateEmpty();
}

function _invSync() {
  if (!_invATbody || !_invATa) return;
  var o = {};
  _invATbody.querySelectorAll('tr').forEach(function(tr) {
    var k = tr.querySelector('.inv-key-inp');
    var v = tr.querySelector('.inv-val-inp');
    if (k && v && k.value.trim()) o[k.value.trim()] = v.value;
  });
  _invATa.value = JSON.stringify(o);
}

function _invUpdateEmpty() {
  var emEl = document.getElementById('invAttrsEmpty');
  if (!emEl || !_invATbody) return;
  emEl.style.display = _invATbody.rows.length === 0 ? 'block' : 'none';
}

function _invEsc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── BOM inline visibility toggle + переміщення ──────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  var bomTypeSelect = document.querySelector('[name="bom_type"]');
  var bomInline = document.getElementById('productcomponent_set-group');

  if (bomTypeSelect && bomInline) {
    // Перенести inline одразу після bom_type поля
    var bomTypeRow = bomTypeSelect.closest('.form-row');
    if (bomTypeRow && bomTypeRow.parentNode) {
      bomTypeRow.parentNode.insertBefore(bomInline, bomTypeRow.nextSibling);
    }

    function toggleBomInline() {
      if (bomTypeSelect.value === 'key') {
        bomInline.classList.remove('bom-hidden');
      } else {
        bomInline.classList.add('bom-hidden');
      }
    }

    // На вибір bom_type
    bomTypeSelect.addEventListener('change', toggleBomInline);

    // При завантаженні сторінки
    toggleBomInline();
  }
});

/* ── Sync from DigiKey listing ─────────────────────────────────────────── */
(function() {
  var SYNC_URL = '{{ sync_attrs_url|default:"" }}';
  var CSRF = document.cookie.match(/csrftoken=([^;]+)/);
  CSRF = CSRF ? CSRF[1] : '';

  document.addEventListener('DOMContentLoaded', function() {
    invAttrsInit();
    var syncBtn = document.getElementById('invSyncBtn');
    var syncSt  = document.getElementById('invSyncStatus');
    if (syncBtn && SYNC_URL) {
      syncBtn.style.display = 'inline-block';
      syncBtn.addEventListener('click', function() {
        if (!confirm('Синхронізувати атрибути з DigiKey лістингу? Поточні значення буде замінено.')) return;
        syncBtn.disabled = true;
        if (syncSt) syncSt.textContent = '⏳ Синхронізація…';
        fetch(SYNC_URL + '?ajax=1', {
          headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': CSRF },
          credentials: 'same-origin',
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          syncBtn.disabled = false;
          if (data.ok) {
            if (syncSt) { syncSt.textContent = '✅ Синхронізовано'; syncSt.style.color = '#00bfa5'; }
            while (_invATbody.firstChild) _invATbody.removeChild(_invATbody.firstChild);
            Object.keys(data.attrs || {}).sort().forEach(function(k) { _invAddRow(k, data.attrs[k]); });
            _invSync(); _invUpdateEmpty();
          } else {
            if (syncSt) { syncSt.textContent = '❌ ' + (data.error || 'Помилка'); syncSt.style.color = '#ef5350'; }
          }
        })
        .catch(function(e) {
          syncBtn.disabled = false;
          if (syncSt) { syncSt.textContent = '❌ ' + e.message; syncSt.style.color = '#ef5350'; }
        });
      });
    }
  });
})();
</script>

{{ bp_config|json_script:"bp-config" }}
<script>
/* Базові ціни: таблиця «кількість | ціна | знижка | у валюті магазину» + інструменти.
   Усе рахується на сторінці; зберігається кнопкою «Зберегти» форми (історія змін — на сервері). */
document.addEventListener('DOMContentLoaded', function () {
  var ta = document.querySelector('textarea[name="base_prices_text"]');
  if (!ta) return;
  var cfgEl = document.getElementById('bp-config');
  var cfg = {}; try { cfg = JSON.parse(cfgEl ? cfgEl.textContent : '{}') || {}; } catch (e) {}
  var rates = cfg.fx_rates || {}, home = (cfg.home || 'EUR').toUpperCase();
  rates[home] = 1;
  var curInp = document.querySelector('input[name="base_currency"]');
  var buyInp = document.getElementById('id_purchase_price');

  function num(v) { v = String(v == null ? '' : v).trim().replace(/\s/g, '').replace(',', '.'); return v === '' ? NaN : Number(v); }
  function fmt(n) { return (Math.round(n * 10000) / 10000).toFixed(4).replace(/\.?0+$/, ''); }
  function money(n) { return n.toFixed(2).replace('.', ','); }
  function roundMode(v, mode) {
    if (!mode || mode === 'none' || !(v > 0)) return v;
    if (mode === 'x.90' || mode === 'x.99') {
      var end = Number(mode.slice(1)), r = Math.floor(v) + end;
      if (r - v > 0.5) r -= 1;
      return Math.max(r, end);
    }
    var step = Number(mode); return Math.round(v / step) * step;
  }
  function rate(from, to) {
    from = (from || '').toUpperCase(); to = (to || '').toUpperCase();
    if (from === to) return 1;
    var a = rates[from], b = rates[to];
    return a && b ? a / b : null;
  }

  // ── Розмітка ──
  var wrap = document.createElement('div');
  wrap.className = 'inv-bp';
  var rOpts = (cfg.roundings || [['0.01', 'До 0,01']]).map(function (r) {
    return '<option value="' + r[0] + '"' + (r[0] === cfg.rounding ? ' selected' : '') + '>' + r[1] + '</option>';
  }).join('');
  wrap.innerHTML =
    '<div class="inv-bp-tools">' +
      '<span class="inv-bp-tool">Ціна за 1 шт. <input type="text" class="t-base"><button type="button" class="b-base" title="Нова ціна за 1 шт.; інші ступені перераховуються зі збереженням знижок">Застосувати</button></span>' +
      '<span class="inv-bp-tool">Усі ціни <input type="text" class="t-pct" placeholder="+5"> % <button type="button" class="b-pct">Змінити</button></span>' +
      '<span class="inv-bp-tool">Закупівля + <input type="text" class="t-mk" value="' + (cfg.markup != null ? cfg.markup : 100) + '"> % <button type="button" class="b-mk" title="Ціна за 1 шт. = закупівельна × (1 + націнка); знижки ступенів зберігаються">→ ціна 1 шт.</button></span>' +
      '<span class="inv-bp-sep"></span>' +
      '<span class="inv-bp-tool"><button type="button" class="b-tpl" title="Ступені від ціни за 1 шт. за шаблоном «Налаштування цін»">Знижки за шаблоном</button></span>' +
      '<span class="inv-bp-tool">Округлення <select class="t-rnd">' + rOpts + '</select><button type="button" class="b-rnd">Округлити</button></span>' +
      '<span class="inv-bp-sep"></span>' +
      '<span class="inv-bp-tool">Конвертувати в <input type="text" class="cur t-to" maxlength="3" value="' + home + '"> курс <input type="text" class="t-rate"> <button type="button" class="b-conv">Конвертувати</button></span>' +
    '</div>' +
    '<table class="inv-bp-table"><thead><tr><th>Від кількості, шт.</th><th>Ціна за шт.</th><th>Знижка від 1 шт., %</th>' +
      '<th class="h-cv" style="text-align:right">≈ у ' + home + '</th><th style="width:36px"></th></tr></thead><tbody></tbody></table>' +
    '<div class="inv-bp-foot"><button type="button" class="inv-bp-btn b-add">+ Додати ступінь</button>' +
      '<button type="button" class="inv-bp-btn b-undo" title="Повернути ціни, як були при відкритті сторінки">↶ Скасувати зміни</button>' +
      '<span class="bp-state">Порядок за кількістю — автоматично при збереженні</span></div>';
  ta.parentNode.insertBefore(wrap, ta);
  var body = wrap.querySelector('tbody'), $ = function (c) { return wrap.querySelector(c); };
  var initial = ta.value, initialCur = curInp ? curInp.value : '';

  // ── Рядки ──
  function rows() {
    return Array.prototype.map.call(body.querySelectorAll('tr'), function (tr) {
      return { tr: tr, q: tr.querySelector('.bp-q'), p: tr.querySelector('.bp-p'), d: tr.querySelector('.bp-d') };
    });
  }
  function baseRow() { return rows().filter(function (r) { return num(r.q.value) === 1; })[0]; }
  function basePrice() { var b = baseRow(); return b ? num(b.p.value) : NaN; }
  function addRow(q, p) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><input type="text" inputmode="numeric" class="bp-q" placeholder="напр. 10"></td>' +
      '<td><input type="text" inputmode="decimal" class="bp-p" placeholder="0.00"></td>' +
      '<td><input type="text" inputmode="decimal" class="bp-d" placeholder="—" title="Введіть знижку — ціна порахується від ціни за 1 шт."></td>' +
      '<td class="inv-bp-cv"></td><td><button type="button" class="inv-del-row" title="Видалити">×</button></td>';
    tr.querySelector('.bp-q').value = q || '';
    tr.querySelector('.bp-p').value = p || '';
    tr.querySelector('.bp-q').addEventListener('input', sync);
    tr.querySelector('.bp-p').addEventListener('input', sync);
    tr.querySelector('.bp-d').addEventListener('input', function () {   // знижка → ціна
      var d = num(this.value), b = basePrice();
      if (d >= 0 && d < 100 && b > 0) tr.querySelector('.bp-p').value = fmt(b * (1 - d / 100));
      sync(true);
    });
    tr.querySelector('.inv-del-row').addEventListener('click', function () { tr.remove(); sync(); });
    body.appendChild(tr);
    return tr;
  }
  function load(text) {
    body.innerHTML = '';
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var m = line.match(/^\s*(\d+)\s*[:=;\t ]\s*([\d.,]+)\s*$/);
      if (m) addRow(m[1], m[2]);
    });
    if (!body.children.length) addRow('1', '');
  }

  // ── Синхронізація: знижки, ≈ у валюті магазину, textarea ──
  function sync(keepDiscount) {
    var b = basePrice(), list = [];
    var r = rate(curInp ? curInp.value : home, home);
    $('.h-cv').textContent = r === 1 ? '' : '≈ у ' + home + (r ? ' (курс ' + fmt(r) + ')' : ' (немає курсу)');
    rows().forEach(function (x) {
      var qn = num(x.q.value), pn = num(x.p.value);
      x.q.classList.toggle('is-bad', x.q.value.trim() !== '' && !(qn >= 1 && Math.floor(qn) === qn));
      x.p.classList.toggle('is-bad', x.p.value.trim() !== '' && !(pn > 0));
      if (keepDiscount !== true || document.activeElement !== x.d) {
        x.d.value = b > 0 && pn > 0 && qn > 1 ? (Math.round((1 - pn / b) * 1000) / 10).toString().replace('.', ',') : '';
      }
      x.d.disabled = qn === 1;
      x.tr.querySelector('.inv-bp-cv').textContent = r && r !== 1 && pn > 0 ? money(pn * r) + ' ' + home : '';
      if (x.p.value.trim()) list.push({ q: x.q.value.trim(), p: x.p.value.trim().replace(',', '.'), qn: qn });
    });
    list.sort(function (a, c) { return (a.qn || 0) - (c.qn || 0); });
    ta.value = list.map(function (x) { return x.q + ': ' + x.p; }).join('\n');
    var initMap = {}; initial.split('\n').forEach(function (l) { var m = l.split(':'); if (m.length === 2) initMap[m[0].trim()] = num(m[1]); });
    rows().forEach(function (x) { x.tr.classList.toggle('is-changed', initMap[x.q.value.trim()] !== num(x.p.value)); });
    var dirty = ta.value !== initial;
    var st = $('.bp-state');
    st.textContent = dirty ? 'Є незбережені зміни — натисніть «Зберегти» внизу сторінки' : 'Порядок за кількістю — автоматично при збереженні';
    st.classList.toggle('inv-bp-dirty', dirty);
    if (document.activeElement !== $('.t-base')) $('.t-base').value = b > 0 ? fmt(b) : '';
    if (document.activeElement !== $('.t-rate')) {
      var cr = rate(curInp ? curInp.value : home, $('.t-to').value);
      $('.t-rate').value = cr ? fmt(cr) : '';
    }
  }

  // ── Інструменти ──
  function eachPrice(fn, noRound) {   // з округленням за вибраним правилом
    var m = noRound ? null : $('.t-rnd').value;
    rows().forEach(function (x) { var p = num(x.p.value); if (p > 0) x.p.value = fmt(roundMode(fn(p, num(x.q.value)), m)); });
  }
  function setBase(newBase) {          // нова ціна 1 шт., знижки інших ступенів зберігаються
    var b = basePrice();
    if (!(newBase > 0)) return;
    if (b > 0) { eachPrice(function (p) { return p * newBase / b; }); baseRow().p.value = fmt(newBase); }
    else { var br = baseRow() || addRow('1', ''); br.p.value = fmt(newBase); }
    sync();
  }
  $('.b-base').addEventListener('click', function () { setBase(num($('.t-base').value)); });
  $('.b-pct').addEventListener('click', function () {
    var pct = num($('.t-pct').value); if (isNaN(pct)) return $('.t-pct').focus();
    eachPrice(function (p) { return p * (100 + pct) / 100; }); sync();
  });
  $('.b-mk').addEventListener('click', function () {
    var buy = buyInp ? num(buyInp.value) : NaN, mk = num($('.t-mk').value);
    if (!(buy > 0)) { alert('Спершу заповніть «Ціна закупки» (у валюті базових цін).'); return; }
    setBase(roundMode(buy * (100 + (mk || 0)) / 100, $('.t-rnd').value));
  });
  $('.b-tpl').addEventListener('click', function () {
    var b = basePrice(), tpl = cfg.template || [];
    if (!(b > 0)) { alert('Спершу вкажіть ціну за 1 шт.'); return; }
    if (!tpl.length) { alert('Шаблон знижок порожній («Інтернет-магазин → Налаштування цін»).'); return; }
    if (!confirm('Замінити всі ступені на шаблон (' + tpl.map(function (t) { return t.min_qty + ' шт. −' + t.discount + ' %'; }).join(', ') + ')?')) return;
    body.innerHTML = ''; addRow('1', fmt(b));
    tpl.forEach(function (t) { if (t.min_qty > 1) addRow(String(t.min_qty), fmt(roundMode(b * (100 - t.discount) / 100, $('.t-rnd').value))); });
    sync();
  });
  $('.b-rnd').addEventListener('click', function () { var m = $('.t-rnd').value; eachPrice(function (p) { return roundMode(p, m); }); sync(); });
  $('.t-to').addEventListener('input', function () { $('.t-rate').value = ''; sync(); });
  $('.b-conv').addEventListener('click', function () {
    var to = $('.t-to').value.trim().toUpperCase(), r = num($('.t-rate').value);
    if (!/^[A-Z]{3}$/.test(to)) return $('.t-to').focus();
    if (!(r > 0)) { alert('Вкажіть курс: 1 ' + (curInp ? curInp.value : '') + ' = ? ' + to); return $('.t-rate').focus(); }
    eachPrice(function (p) { return p * r; });
    if (curInp) curInp.value = to;
    sync();
  });
  if (curInp) curInp.addEventListener('input', function () { sync(); });
  $('.b-add').addEventListener('click', function () { var tr = addRow('', ''); tr.querySelector('.bp-q').focus(); sync(); });
  $('.b-undo').addEventListener('click', function () { if (curInp) curInp.value = initialCur; load(initial); sync(); });

  load(ta.value);
  sync();
});
</script>
{% endblock %}

{% block after_field_sets %}
{{ block.super }}
<script>
// Перенести inline одразу ПІСЛЯ Availability fieldset
document.addEventListener('DOMContentLoaded', function(e) {
  var bomInline = document.getElementById('productcomponent_set-group');

  // Знайти Availability fieldset - шукати по полю id_buildable_qty або id_stock_qty
  var buildableField = document.getElementById('id_buildable_qty');
  var stockField = document.getElementById('id_stock_qty');
  var targetField = buildableField || stockField;
  var availabilityFieldset = null;

  if (targetField) {
    // Піднятися вгору до найближчого fieldset
    availabilityFieldset = targetField.closest('fieldset');
  }

  if (bomInline && availabilityFieldset) {
    // Вставити inline одразу після Availability fieldset
    availabilityFieldset.parentNode.insertBefore(bomInline, availabilityFieldset.nextSibling);
  }

  // Ховати/показувати inline залежно від bom_type
  var bomTypeSelect = document.querySelector('[name="bom_type"]');
  if (bomTypeSelect && bomInline) {
    function toggleBomInline() {
      if (bomTypeSelect.value === 'key') {
        bomInline.classList.remove('bom-hidden');
      } else {
        bomInline.classList.add('bom-hidden');
      }
    }
    bomTypeSelect.addEventListener('change', toggleBomInline);
    toggleBomInline();
  }
});
</script>
{% endblock %}
