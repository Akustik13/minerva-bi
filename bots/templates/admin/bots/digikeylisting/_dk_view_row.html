<tr class="{% if r.state == 'diff' %}dv-diff{% elif r.state == 'missing' %}dv-missing{% elif r.state == 'unknown' %}dv-unknown{% endif %}">
  {% if pick and can_change %}<td>{% if r.pushable %}<input type="checkbox" name="fields" value="{{ r.key }}" checked title="Оновити на DigiKey з Minerva">{% endif %}</td>{% endif %}
  <td>{{ r.label }}</td><td class="v">{{ r.minerva }}</td><td class="v">{{ r.dk }}</td>
  <td>{% if r.state == 'same' %}✓{% elif r.state == 'diff' %}<span title="На DigiKey інакше, ніж у Minerva">≠</span>{% elif r.state == 'unknown' %}<span title="DigiKey через API цього не повертає">?</span>{% else %}—{% endif %}</td>
</tr>
