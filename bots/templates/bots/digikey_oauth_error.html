<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Авторизацію DigiKey не прийнято | Minerva</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080b0f; color: #c9d8e4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; padding: 40px 16px; max-width: 520px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: #e6edf3; margin-bottom: 12px; }
    p { font-size: 14px; color: #8fa5b8; line-height: 1.6; margin-bottom: 14px; }
    .note { font-size: 13px; color: #607d8b; margin-bottom: 28px; }
    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 11px 22px;
      background: linear-gradient(135deg, #1a2e4a, #1e3a5f);
      border: 1px solid #2a4a6a; border-radius: 8px;
      color: #58a6ff; font-size: 14px; font-weight: 600; text-decoration: none;
    }
    .btn:hover { border-color: #2196f3; }
    .brand { font-size: 12px; color: #3a5570; margin-top: 36px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="icon">🔐</div>
  <h1>Авторизацію DigiKey не прийнято</h1>
  <p>{{ reason }}</p>
  <p class="note">Токени DigiKey Marketplace у Minerva не змінено.</p>
  <div class="btns">
    {% if anonymous %}<a href="{{ login_url }}" class="btn">Увійти в Minerva</a>{% endif %}
    <a href="{{ config_url }}" class="btn">← До налаштувань DigiKey</a>
  </div>
  <div class="brand">🏛️ Minerva Business Intelligence</div>
</div>
</body>
</html>
