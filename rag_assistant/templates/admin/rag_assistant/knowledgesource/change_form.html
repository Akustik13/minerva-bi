{% extends "admin/change_form.html" %}
{# «📂 Джерело знань»: поля папки / сайту за видом, «📤 Файли з ПК» (upload_panel.html) і 🗑 у «Документи джерела» #}
{% block extrastyle %}{{ block.super }}
<style>
  #ks-up { max-width: 820px; }
  #ks-up .ks-drop { border: 2px dashed var(--hairline-color, #ccc); border-radius: 8px; padding: 14px; }
  #ks-up .ks-drop.ks-over { border-color: var(--primary, #417690); background: var(--darkened-bg, #f4f4f4); }
  #ks-up .ks-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #ks-up .ks-hint { color: var(--body-quiet-color, #888); }
  #ks-up .ks-opts { display: flex; flex-wrap: wrap; gap: 18px; margin: 8px 0 4px; }
  #ks-up .ks-progress { margin-top: 8px; font-weight: 600; }
  #ks-up .ks-log { margin: 6px 0 0; padding-left: 18px; max-height: 260px; overflow: auto; }
  #ks-up .ks-log li { list-style: none; margin: 1px 0; overflow-wrap: anywhere; }
  #ks-up .ks-log .ks-bad { color: #e57373; }
  #ks-up .ks-log .ks-skip { color: var(--body-quiet-color, #888); }
  .ks-files { border-collapse: collapse; max-width: 1000px; }
  .ks-files th, .ks-files td { padding: 3px 10px 3px 0; text-align: left; vertical-align: top; border: 0;
                               border-bottom: 1px solid var(--hairline-color, #eee); }
  .ks-files td:first-child { overflow-wrap: anywhere; }
  .ks-files .ks-num { white-space: nowrap; }
  .ks-files .ks-in { color: #4caf50; }
  .ks-files .ks-err { color: #e57373; font-size: 12px; }
  .ks-files .ks-tag { font-size: 12px; color: var(--body-quiet-color, #888); margin-left: 6px; }
  .ks-files .ks-del { background: none; border: 0; cursor: pointer; font-size: 15px; padding: 0 4px; }
</style>
{% endblock %}

{% block admin_change_form_document_ready %}{{ block.super }}
<script>
(function () {
  // Поля за видом: папка — шлях, підпапки, типи; сайт — посилання
  var kind = document.getElementById('id_kind');
  function toggle() {
    var folder = !kind || kind.value === 'folder';
    document.querySelectorAll('.field-path, .field-recursive, .field-file_types_text, .field-max_file_mb, .field-roots_help, fieldset.ks-folder-only')
      .forEach(function (e) { e.style.display = folder ? '' : 'none'; });
    document.querySelectorAll('.field-url, .field-follow_links')
      .forEach(function (e) { e.style.display = folder ? 'none' : ''; });
  }
  if (kind) kind.addEventListener('change', toggle);
  toggle();

  var csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
  var csrf = csrfInput ? csrfInput.value : '';
  function post(url, fd) {
    return fetch(url, {method: 'POST', body: fd, headers: {'X-CSRFToken': csrf}, credentials: 'same-origin'})
      .then(function (r) {
        return r.json().catch(function () {
          return {ok: false, error: r.status === 413 ? 'файл завеликий для сервера (обмеження проксі NAS)' : 'HTTP ' + r.status};
        });
      });
  }

  // 🗑 файл у папці, яку створила Minerva
  var table = document.getElementById('ks-files-table');
  if (table) table.addEventListener('click', function (e) {
    var btn = e.target.closest('.ks-del');
    if (!btn) return;
    var path = btn.dataset.path;
    if (!confirm('Видалити «' + path + '» з папки й бази знань?')) return;
    var fd = new FormData();
    fd.append('path', path);
    post(table.dataset.delete, fd).then(function (j) {
      if (j.ok) btn.closest('tr').remove(); else alert(j.error || 'Не вдалося видалити');
    });
  });

  // 📤 Файли з ПК
  var box = document.getElementById('ks-up');
  if (!box) return;
  var types = (box.dataset.types || '').split(',').filter(Boolean);
  var maxMb = +box.dataset.maxMb || 25;
  var log = document.getElementById('ks-log'), prog = document.getElementById('ks-progress');
  var sub = document.getElementById('ks-sub'), replace = document.getElementById('ks-replace');
  var form = box.closest('form'), dirty = false, busy = false;
  var KEY = 'ks-log-' + box.dataset.upload;
  try {
    var saved = sessionStorage.getItem(KEY);
    if (saved) { log.innerHTML = saved; sessionStorage.removeItem(KEY); }
  } catch (e) { /* без сховища — без журналу після оновлення */ }
  if (form) form.addEventListener('input', function (e) { if (!box.contains(e.target)) dirty = true; });
  sub.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });   // не «Зберегти»

  function row(cls, text) {
    var li = document.createElement('li');
    li.className = cls;
    li.textContent = text;
    log.appendChild(li);
  }
  function hiddenPath(p) {
    return p.split('/').some(function (part) { return /^(\.|~\$|@|#)/.test(part); });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function waitScan() {
    for (var i = 0; i < 300; i++) {
      await sleep(2000);
      var j = await fetch(box.dataset.status, {credentials: 'same-origin'}).then(function (r) { return r.json(); })
        .catch(function () { return null; });
      if (j && !j.running) return j;
    }
    return null;
  }

  async function upload(list) {
    if (busy || !list.length) return;
    busy = true;
    var todo = list.filter(function (x) { return !hiddenPath(x.rel || x.file.name); });
    var skipped = list.length - todo.length, ok = 0, bad = 0;
    log.innerHTML = '';
    prog.hidden = false;
    for (var n = 0; n < todo.length; n++) {
      var x = todo[n], label = x.rel || x.file.name;
      prog.textContent = '⏳ ' + (n + 1) + ' / ' + todo.length + ': ' + label;
      var ext = x.file.name.indexOf('.') >= 0 ? x.file.name.split('.').pop().toLowerCase() : '';
      if (types.indexOf(ext) < 0) { row('ks-bad', '– ' + label + ': файли .' + (ext || '?') + ' сюди не беруться'); bad++; continue; }
      if (x.file.size > maxMb * 1048576) { row('ks-bad', '– ' + label + ': більший за ' + maxMb + ' МБ'); bad++; continue; }
      var fd = new FormData();
      fd.append('file', x.file);
      fd.append('relpath', x.rel || '');
      fd.append('subfolder', sub.value);
      fd.append('replace', replace.checked ? '1' : '0');
      try {
        var j = await post(box.dataset.upload, fd);
        if (j.ok) {
          ok++;
          row('ks-ok', ({added: '✓ додано', replaced: '↻ замінено', exists: '= уже є, пропущено'}[j.status] || '✓') + ': ' + j.path);
        } else { bad++; row('ks-bad', '⚠️ ' + label + ': ' + j.error); }
      } catch (e) { bad++; row('ks-bad', '⚠️ ' + label + ': немає зв\'язку з Minerva'); }
    }
    if (skipped) row('ks-skip', '– пропущено прихованих і службових файлів: ' + skipped);
    var summary = 'Завантажено ' + ok + ' з ' + todo.length + (bad ? ' · не вдалося ' + bad : '');
    prog.textContent = summary;
    if (ok) {
      var done = new FormData();
      done.append('action', 'done');
      var s = await post(box.dataset.upload, done).catch(function () { return {}; });
      prog.textContent = summary + (s.scan === 'queued' ? ' · Minerva додасть їх у базу знань після поточної перевірки…'
                                                        : ' · Minerva додає їх у базу знань…');
      var st = await waitScan();
      summary += st ? ' · ✓ готово, документів у джерелі: ' + st.documents : '';
      prog.textContent = summary;
      if (!dirty) {                                    // журнал переживає оновлення сторінки (sessionStorage)
        var head = document.createElement('li'), b = document.createElement('b');
        head.className = 'ks-ok';
        b.textContent = summary;
        head.appendChild(b);
        log.insertBefore(head, log.firstChild);
        try { sessionStorage.setItem(KEY, log.innerHTML); } catch (e) { /* без сховища — лише оновлення */ }
        location.reload();
      } else {
        row('ks-skip', 'Оновіть сторінку, щоб побачити нові документи (спершу збережіть змінені поля).');
      }
    }
    busy = false;
  }

  var pickFiles = document.getElementById('ks-files'), pickDir = document.getElementById('ks-dir');
  document.getElementById('ks-pick-files').addEventListener('click', function () { pickFiles.click(); });
  document.getElementById('ks-pick-dir').addEventListener('click', function () { pickDir.click(); });
  pickFiles.addEventListener('change', function () {
    upload(Array.from(pickFiles.files).map(function (f) { return {file: f, rel: ''}; }));
    pickFiles.value = '';
  });
  pickDir.addEventListener('change', function () {
    upload(Array.from(pickDir.files).map(function (f) { return {file: f, rel: f.webkitRelativePath || ''}; }));
    pickDir.value = '';
  });

  // Перетягування: файли й папки (з підпапками)
  function walk(entry, out) {
    return new Promise(function (resolve) {
      if (entry.isFile) {
        entry.file(function (f) { out.push({file: f, rel: entry.fullPath.replace(/^\//, '')}); resolve(); }, resolve);
      } else if (entry.isDirectory) {
        var reader = entry.createReader(), all = [];
        (function read() {
          reader.readEntries(async function (ents) {
            if (!ents.length) {
              for (var i = 0; i < all.length; i++) await walk(all[i], out);
              resolve();
            } else { all = all.concat(Array.from(ents)); read(); }
          }, resolve);
        })();
      } else resolve();
    });
  }
  var drop = document.getElementById('ks-drop');
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('ks-over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('ks-over'); });
  });
  drop.addEventListener('drop', async function (e) {
    var entries = Array.from(e.dataTransfer.items || []).map(function (i) { return i.webkitGetAsEntry && i.webkitGetAsEntry(); })
      .filter(Boolean);
    if (!entries.length) return upload(Array.from(e.dataTransfer.files).map(function (f) { return {file: f, rel: ''}; }));
    var out = [];
    for (var i = 0; i < entries.length; i++) await walk(entries[i], out);
    upload(out);
  });
  // файл, кинутий повз поле, не відкривається замість сторінки
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });
})();
</script>
{% endblock %}
