{# Жива панель «Що зараз робить RAG» на сторінці «База знань»: дані — knowledge.progress(), оновлення — live/ кожні 5 с #}
{{ progress|json_script:"kl-data" }}
<style>
  #kl { max-width: 760px; }
  /* Дорожня карта: крапки з лінією; лінія перед кроком зафарбована, якщо до нього дійшли */
  #kl .kl-road { display: flex; list-style: none; margin: 4px 0 12px; padding: 0; }
  #kl .kl-road li { flex: 1; position: relative; text-align: center; padding: 0 2px; min-width: 0; list-style: none;
                    color: var(--body-quiet-color, #888); }
  #kl .kl-road li::before { content: ''; position: absolute; top: 9px; left: -50%; width: 100%; height: 3px;
                            background: var(--hairline-color, #ccc); }
  #kl .kl-road li:first-child::before { display: none; }
  #kl .kl-road li.done::before, #kl .kl-road li.current::before { background: var(--primary, #417690); }
  #kl .kl-road .dot { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center;
                      width: 21px; height: 21px; box-sizing: border-box; border-radius: 50%; font-size: 11px; line-height: 1;
                      border: 3px solid var(--hairline-color, #ccc); background: var(--body-bg, #fff); color: #fff; }
  #kl .kl-road li.done .dot { background: var(--primary, #417690); border-color: var(--primary, #417690); }
  #kl .kl-road li.current .dot { border-color: var(--primary, #417690); color: var(--primary, #417690); }
  #kl .kl-road li.current .dot::after { content: ''; position: absolute; inset: -3px; border-radius: 50%;
                                        border: 2px solid currentColor; animation: kl-pulse 1.6s ease-out infinite; }
  #kl .kl-road li.current.still .dot::after { display: none; }
  @keyframes kl-pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2); opacity: 0; } }
  #kl .kl-road .lbl { display: block; margin-top: 4px; font-size: 12px; hyphens: auto; }
  #kl .kl-road li.done .lbl { color: var(--body-fg, #333); }
  #kl .kl-road li.current .lbl { color: var(--body-fg, #333); font-weight: 700; }
  #kl .kl-road .det { display: block; margin-top: 1px; font-size: 11px; overflow-wrap: anywhere; }
  #kl .kl-road li.current .det { color: var(--body-fg, #333); font-weight: 600; }
  #kl .kl-text { font-size: 14px; font-weight: 600; margin: 4px 0 8px; }
  #kl .kl-bar { height: 10px; border-radius: 5px; background: var(--darkened-bg, #eee); overflow: hidden; margin: 6px 0; }
  #kl .kl-bar > div { height: 100%; width: 0; background: var(--primary, #417690); transition: width .6s; }
  #kl .kl-line { margin: 3px 0; color: var(--body-quiet-color, #666); }
  #kl .kl-line b { color: var(--body-fg, #333); }
  #kl .kl-warn { margin: 8px 0; padding: 6px 10px; border-radius: 4px; background: rgba(229, 115, 115, .15);
                 border-left: 3px solid #e57373; }
  #kl .kl-buttons { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  #kl .kl-updated { font-size: 11px; color: var(--body-quiet-color, #999); margin-top: 6px; }
</style>
<div id="kl" data-url="{{ live_url }}">
  <ol class="kl-road" id="kl-road" lang="uk" aria-label="Етапи індексації"></ol>
  <div class="kl-text" id="kl-text"></div>
  <div class="kl-bar" id="kl-bar" hidden><div id="kl-fill"></div></div>
  <div class="kl-line" id="kl-progress"></div>
  <div class="kl-line" id="kl-flow"></div>
  <div class="kl-line" id="kl-docs"></div>
  <div class="kl-line" id="kl-seen"></div>
  <div class="kl-line" id="kl-rag"></div>
  <div class="kl-warn" id="kl-warn" hidden></div>
  <div class="kl-buttons">
    {% if paused %}
      <button type="submit" class="button default" formaction="{{ pause_url }}?action=resume" formnovalidate>▶ Продовжити індексацію</button>
    {% else %}
      <button type="submit" class="button" formaction="{{ pause_url }}?action=pause" formnovalidate
              title="RAG зупиниться після поточного листа; пошук працює з уже проіндексованим">⏸ Пауза</button>
    {% endif %}
    <button type="submit" class="button" formaction="{{ refresh_url }}" formnovalidate
            title="Minerva заново перевірить, які листи мають бути в індексі, і передасть відмінності">🔄 Звірити стрічку зараз</button>
    <button type="submit" class="button" formaction="{{ generation_url }}" formnovalidate
            onclick="return confirm('RAG забуде поточний індекс і заново проіндексує ВСІ листи — це довго. Потрібно також після відновлення БД з бекапу. Продовжити?')">♻ Переіндексувати все з нуля</button>
    <button type="submit" class="button" formaction="{{ clear_url }}" formnovalidate
            onclick="return confirm('Прибрати всі листи з індексу RAG і вимкнути індексацію?')">🧹 Прибрати все з індексу</button>
  </div>
  <div class="kl-updated" id="kl-updated"></div>
</div>
<script>
(function () {
  var box = document.getElementById('kl');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  var url = box.dataset.url, ticks = 0, failures = 0, flow = null;
  function $(id) { return document.getElementById(id); }
  function span(s) {
    if (s < 60) return s + ' с';
    if (s < 3600) return Math.round(s / 60) + ' хв';
    return Math.round(s / 3600) + ' год';
  }
  function ago(s) { return s === null || s === undefined ? 'ще не звертався' : span(s) + ' тому'; }
  function setText(id, text) { $(id).textContent = text || ''; $(id).hidden = !text; }
  function road(p) {
    var ol = $('kl-road');
    ol.textContent = '';
    (p.steps || []).forEach(function (st) {
      var li = document.createElement('li'), dot = document.createElement('span'),
          lbl = document.createElement('span'), det = document.createElement('span');
      li.className = st.status + (st.status === 'current' && (p.stage === 'paused' || p.silent) ? ' still' : '');
      dot.className = 'dot';
      dot.textContent = st.status === 'done' ? '✓' : (st.status === 'current' && p.stage === 'paused' ? '⏸' : '');
      lbl.className = 'lbl'; lbl.textContent = st.label;
      det.className = 'det'; det.textContent = st.detail || '';
      li.title = st.label + (st.detail ? ': ' + st.detail : '');
      li.append(dot, lbl, det);
      ol.appendChild(li);
    });
  }
  // Швидкість підтверджень рахує браузер: з першого стану на цьому етапі, поки сторінка відкрита
  function flowText(p) {
    var d = p.documents || {}, seq = p.seq || {}, now = Date.now(),
        left = p.stage === 'changes' ? (seq.last || 0) - (seq.applied || 0) : (d.pending || 0) + (d.pending_delete || 0);
    if (p.stage !== 'confirm' && p.stage !== 'changes') { flow = null; return ''; }
    if (!flow || flow.stage !== p.stage || p.reported < flow.reported)
      flow = {stage: p.stage, t: now, reported: p.reported || 0, left: left};
    var secs = Math.round((now - flow.t) / 1000);
    if (secs < 60) return 'Рахую темп — потрібна хвилина з відкритою сторінкою…';
    var done = Math.max(0, flow.left - left), eta = done > 0 ? ' · за цим темпом залишилось ~' + span(Math.round(left * secs / done)) : '';
    if (p.stage === 'changes') return 'За ' + span(secs) + ': RAG застосував подій ' + done + eta;
    return 'За ' + span(secs) + ': звітів від RAG ' + ((p.reported || 0) - flow.reported) + ', підтверджено документів ' + done + eta;
  }
  function render(p) {
    road(p);
    setText('kl-text', p.text);
    setText('kl-flow', flowText(p));
    var bar = p.percent !== null && p.percent !== undefined;
    $('kl-bar').hidden = !bar;
    if (bar) $('kl-fill').style.width = p.percent + '%';
    setText('kl-progress', bar ? (p.percent + '% · ' + Math.min(p.served, p.total) + ' з ' + p.total +
      (p.rate ? ' · ' + p.rate : '') + (p.eta ? ' · залишилось ' + p.eta : '')) : '');
    var d = p.documents || {};
    setText('kl-docs', 'У Minerva: мають бути в індексі ' + (d.eligible || 0) + ' · підтверджено RAG ' + (d.indexed || 0) +
      ' · чекають підтвердження ' + ((d.pending || 0) + (d.pending_delete || 0)) +
      ((d.failed || d.skipped) ? ' · помилки ' + (d.failed || 0) + ' / пропущено ' + (d.skipped || 0) : ''));
    setText('kl-seen', 'RAG востаннє звертався: ' + ago(p.seen_ago) + (p.last_call ? ' — ' + p.last_call : ''));
    setText('kl-rag', p.rag ? 'Сам RAG (перевірено ' + p.rag.checked + '): пошук ' + p.rag.retrieval + ', індексація ' +
      p.rag.indexing + ', документів в індексі ' + (p.rag.docs === null || p.rag.docs === undefined ? '?' : p.rag.docs) : '');
    var warn = [];
    if (p.silent) warn.push('⚠️ RAG не звертався до Minerva вже ' + span(p.seen_ago) +
      '. Перевірте RAG-ПК: задача «Minerva-Private-RAG», журнал D:\\RAG-private-prod\\logs\\runtime.log.');
    if (p.breaker) warn.push('⏸ Після кількох збоїв Minerva не звертається до RAG до ' + p.breaker + '.');
    setText('kl-warn', warn.join(' '));
    setText('kl-updated', 'Оновлено ' + p.updated + ' · сторінка оновлюється сама');
  }
  function tick() {
    ticks += 1;
    fetch(url + (ticks % 6 === 1 ? '?probe=1' : ''), {credentials: 'same-origin', headers: {'Accept': 'application/json'}})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (p) { failures = 0; render(p); })
      .catch(function () { failures += 1; if (failures > 2) setText('kl-updated', 'Немає зв\'язку з Minerva — спробую ще.'); });
  }
  render(JSON.parse($('kl-data').textContent));
  tick();
  setInterval(tick, 5000);
})();
</script>
